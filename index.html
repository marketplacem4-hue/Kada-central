<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Store</title>
    <!-- Tailwind CSS for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom CSS to Hide Google Branded Header -->
    <style>
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }
        .goog-te-gadget-icon { display: none !important; }
        .goog-te-gadget-simple {
            background-color: transparent !important;
            border: none !important;
            padding: 0 !important;
            font-size: 14px !important;
            cursor: pointer;
        }
        .goog-te-gadget-simple span { color: white !important; font-weight: 600; }
        .goog-te-menu-value span { border: none !important; }
    </style>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ta',
                includedLanguages: 'ta,en,si',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body class="bg-gray-100 font-sans pb-24">

    <!-- Top Bar with Clean Language Selector -->
    <div class="bg-gray-900 text-white text-xs py-2 px-4 shadow">
        <div class="container mx-auto flex justify-between items-center">
            <span>வணக்கம்! உங்கள் ஆன்லைன் கடைக்கு நல்வரவு</span>
            
            <!-- Compact Language Dropdown -->
            <div class="flex items-center gap-1.5 bg-gray-800 px-3 py-1 rounded-full border border-gray-700">
                <i class="fa-solid fa-globe text-orange-400"></i>
                <div id="google_translate_element"></div>
            </div>
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="bg-orange-500 text-white sticky top-0 z-40 shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center gap-2">
            <h1 class="text-xl md:text-2xl font-bold tracking-wide flex items-center gap-2">
                <i class="fa-solid fa-store"></i> My Online Store
            </h1>
            
            <!-- Search Bar -->
            <div class="relative w-1/2 hidden md:block">
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="பொருட்களைத் தேடுங்கள் (Search)..." class="w-full px-4 py-1.5 text-black rounded-lg focus:outline-none text-sm">
            </div>

            <!-- Header Cart Indicator -->
            <button onclick="toggleCartModal()" class="relative bg-orange-600 hover:bg-orange-700 px-3 py-1.5 rounded-lg flex items-center gap-2 transition">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span class="font-bold text-sm" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <!-- Category Filter Bar -->
    <nav class="bg-white shadow-sm py-3 mb-6">
        <div class="container mx-auto px-4 flex gap-3 overflow-x-auto text-sm font-medium text-gray-700">
            <button onclick="filterCategory('all')" class="px-4 py-1.5 bg-orange-100 text-orange-600 rounded-full font-semibold border border-orange-300 whitespace-nowrap">அனைத்தும் (All)</button>
            <button onclick="filterCategory('grocery')" class="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-full whitespace-nowrap">மளிகை (Grocery)</button>
            <button onclick="filterCategory('electronics')" class="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-full whitespace-nowrap">எலெக்ட்ரானிக்ஸ் (Electronics)</button>
        </div>
    </nav>

    <!-- Main Content Grid -->
    <main class="container mx-auto px-4">
        <h2 class="text-xl font-bold text-gray-800 mb-4">சிறப்புப் பொருட்கள் (Products)</h2>
        
        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-orange-500 border-t-transparent"></div>
            <p class="mt-2 text-gray-600 font-medium">பொருட்கள் பதிவேற்றப்படுகின்றன...</p>
        </div>

        <!-- Product Cards Container -->
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Products will load dynamically here -->
        </div>
    </main>

    <!-- Floating Bottom Cart Bar -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg p-3 z-30 hidden">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500">மொத்த தொகை (Total):</p>
                <p class="text-lg font-bold text-orange-600" id="cartTotal">Rs. 0</p>
            </div>
            <button onclick="sendCartToWhatsApp()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-5 rounded-lg flex items-center gap-2 text-sm shadow transition">
                <i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp-இல் ஆர்டர் செய்
            </button>
        </div>
    </div>

    <!-- JavaScript Engine -->
    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQIW6nyj8m8_cIGW6k6Akpu86Fo7U_5rfKiYz8nKHatC7GWkZdC6vWBWvZHRInD5vPBMfP-t6ZD2Fye/pub?gid=0&single=true&output=csv';
        
        // உங்கள் வாட்ஸ்அப் எண்ணை இங்கே மாற்றவும் (உதாரணமாக: 94770000000)
        const myPhoneNumber = "94770000000"; 

        let allProducts = [];
        let cart = [];

        async function fetchProducts() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const rows = data.split('\n').map(row => row.trim()).filter(row => row);

                allProducts = rows.slice(1).map(row => {
                    const values = row.split(',').map(v => v.trim());
                    return {
                        name: values[0],
                        price: parseFloat(values[1]) || 0,
                        originalPrice: values[2],
                        category: values[3],
                        imageUrl: values[4]
                    };
                });

                document.getElementById('loading').style.display = 'none';
                displayProducts(allProducts);
            } catch (error) {
                console.error('Error fetching CSV:', error);
                document.getElementById('loading').innerHTML = '<p class="text-red-500">பொருட்களை ஏற்றுவதில் சிக்கல் உள்ளது.</p>';
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            products.forEach((product, index) => {
                const card = `
                    <div class="bg-white rounded-lg shadow hover:shadow-lg transition duration-200 overflow-hidden border border-gray-100 flex flex-col justify-between">
                        <div>
                            <img src="${product.imageUrl}" alt="${product.name}" class="w-full h-36 object-cover bg-gray-50" onerror="this.src='https://via.placeholder.com/250x160?text=No+Image'">
                            <div class="p-3">
                                <span class="text-xs font-semibold uppercase bg-orange-50 text-orange-600 px-2 py-0.5 rounded">${product.category}</span>
                                <h3 class="text-sm font-semibold text-gray-800 mt-1 line-clamp-2">${product.name}</h3>
                                <div class="mt-2 flex items-baseline gap-2">
                                    <span class="text-base font-bold text-orange-600">Rs. ${product.price}</span>
                                    ${product.originalPrice ? `<span class="text-xs text-gray-400 line-through">Rs. ${product.originalPrice}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="p-3 pt-0">
                            <button onclick="addToCart(${index})" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-medium py-1.5 rounded-md flex items-center justify-center gap-1.5 text-sm transition">
                                <i class="fa-solid fa-cart-plus"></i> கார்ட்டில் சேர்
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function addToCart(index) {
            const product = allProducts[index];
            cart.push(product);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotal').innerText = `Rs. ${total}`;

            const cartBar = document.getElementById('cartBar');
            if (cart.length > 0) {
                cartBar.classList.remove('hidden');
            } else {
                cartBar.classList.add('hidden');
            }
        }

        function sendCartToWhatsApp() {
            if (cart.length === 0) return;

            let message = "வணக்கம்! நான் பின்வரும் பொருட்களை ஆர்டர் செய்ய விரும்புகிறேன்:\n\n";
            let total = 0;

            cart.forEach((item, i) => {
                message += `${i + 1}. *${item.name}* - Rs.${item.price}\n`;
                total += item.price;
            });

            message += `\n*மொத்தத் தொகை:* Rs.${total}`;

            const whatsappUrl = `https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        function filterCategory(category) {
            if (category === 'all') {
                displayProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category.toLowerCase() === category.toLowerCase());
                displayProducts(filtered);
            }
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filtered);
        }

        // Initialize App
        fetchProducts();
    </script>
</body>
</html>
