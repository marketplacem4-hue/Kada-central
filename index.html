<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Store</title>
    <!-- Tailwind CSS for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ta',
                includedLanguages: 'ta,en,si',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Top Bar with Google Translate -->
    <div class="bg-gray-800 text-white text-xs py-1.5 px-4">
        <div class="container mx-auto flex justify-between items-center">
            <span>👋 வரவேற்பு! உங்கள் ஆன்லைன் கடைக்கு நல்வரவு</span>
            <!-- Translate Dropdown Container -->
            <div id="google_translate_element"></div>
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="bg-orange-500 text-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center gap-2">
            <h1 class="text-xl md:text-2xl font-bold tracking-wide flex items-center gap-2">
                <i class="fa-solid fa-store"></i> My Online Store
            </h1>
            <div class="relative w-1/2 hidden md:block">
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="பொருட்களைத் தேடுங்கள் (Search)..." class="w-full px-4 py-2 text-black rounded-lg focus:outline-none">
            </div>
            <div class="text-xs md:text-sm font-semibold flex items-center gap-1">
                <i class="fa-brands fa-whatsapp text-green-300 text-lg"></i> Easy WhatsApp Order
            </div>
        </div>
    </header>

    <!-- Category Filter Bar -->
    <nav class="bg-white shadow-sm py-3 mb-6">
        <div class="container mx-auto px-4 flex gap-3 overflow-x-auto text-sm font-medium text-gray-700">
            <button onclick="filterCategory('all')" class="px-4 py-1.5 bg-orange-100 text-orange-600 rounded-full font-semibold border border-orange-300 whitespace-nowrap">அனைத்தும் (All)</button>
            <button onclick="filterCategory('grocery')" class="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-full whitespace-nowrap">மளிகை (Grocery)</button>
            <button onclick="filterCategory('electronics')" class="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-full whitespace-nowrap">எலெக்ட்ரானிக்ஸ் (Electronics)</button>
        </div>
    </nav>

    <!-- Main Content Grid -->
    <main class="container mx-auto px-4 pb-12">
        <h2 class="text-xl font-bold text-gray-800 mb-4">சிறப்புப் பொருட்கள் (Products)</h2>
        
        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-orange-500 border-t-transparent"></div>
            <p class="mt-2 text-gray-600 font-medium">பொருட்கள் பதிவேற்றப்படுகின்றன...</p>
        </div>

        <!-- Product Cards Container -->
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Products will load dynamically here -->
        </div>
    </main>

    <!-- JavaScript Engine to Fetch Data from Google Sheets -->
    <script>
        // Published CSV link from Google Sheets
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQIW6nyj8m8_cIGW6k6Akpu86Fo7U_5rfKiYz8nKHatC7GWkZdC6vWBWvZHRInD5vPBMfP-t6ZD2Fye/pub?gid=0&single=true&output=csv';
        
        // YOUR WHATSAPP NUMBER HERE (e.g., 94770000000)
        const myPhoneNumber = "94770000000"; 

        let allProducts = [];

        async function fetchProducts() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                const rows = data.split('\n').map(row => row.trim()).filter(row => row);

                allProducts = rows.slice(1).map(row => {
                    const values = row.split(',').map(v => v.trim());
                    return {
                        name: values[0],
                        price: values[1],
                        originalPrice: values[2],
                        category: values[3],
                        imageUrl: values[4]
                    };
                });

                document.getElementById('loading').style.display = 'none';
                displayProducts(allProducts);
            } catch (error) {
                console.error('Error fetching CSV:', error);
                document.getElementById('loading').innerHTML = '<p class="text-red-500">பொருட்களை ஏற்றுவதில் சிக்கல் உள்ளது.</p>';
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            products.forEach(product => {
                const whatsappMessage = encodeURIComponent(`வணக்கம்! நான் உங்கள் கடையில் இந்த பொருளை ஆர்டர் செய்ய விரும்புகிறேன்:\n\n*பொருள்:* ${product.name}\n*விலை:* Rs.${product.price}`);
                const whatsappUrl = `https://wa.me/${myPhoneNumber}?text=${whatsappMessage}`;

                const card = `
                    <div class="bg-white rounded-lg shadow hover:shadow-lg transition duration-200 overflow-hidden border border-gray-100 flex flex-col justify-between">
                        <div>
                            <img src="${product.imageUrl}" alt="${product.name}" class="w-full h-36 object-cover bg-gray-50" onerror="this.src='https://via.placeholder.com/250x160?text=No+Image'">
                            <div class="p-3">
                                <span class="text-xs font-semibold uppercase bg-orange-50 text-orange-600 px-2 py-0.5 rounded">${product.category}</span>
                                <h3 class="text-sm font-semibold text-gray-800 mt-1 line-clamp-2">${product.name}</h3>
                                <div class="mt-2 flex items-baseline gap-2">
                                    <span class="text-base font-bold text-orange-600">Rs. ${product.price}</span>
                                    ${product.originalPrice ? `<span class="text-xs text-gray-400 line-through">Rs. ${product.originalPrice}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="p-3 pt-0">
                            <a href="${whatsappUrl}" target="_blank" class="w-full bg-green-500 hover:bg-green-600 text-white font-medium py-1.5 rounded-md flex items-center justify-center gap-1.5 text-sm transition">
                                <i class="fa-brands fa-whatsapp"></i> Buy via WhatsApp
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function filterCategory(category) {
            if (category === 'all') {
                displayProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category.toLowerCase() === category.toLowerCase());
                displayProducts(filtered);
            }
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filtered);
        }

        // Initialize App
        fetchProducts();
    </script>
</body>
</html>
