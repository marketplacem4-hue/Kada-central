<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kada Central</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; }
        p { font-size: 18px; line-height: 1.6; }
        .btn-container { margin-top: 25px; }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin: 10px;
            font-size: 16px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .whatsapp-btn { background-color: #25D366; }
        .map-btn { background-color: #4285F4; }
        .call-btn { background-color: #e74c3c; }
    </style>
</head>
<body>

    <div class="container">
        <!-- உங்கள் கடையின் பெயர் -->
        <h1>Kada Central</h1>
        <p>எங்கள் கடையின் சிறந்த பொருட்கள் மற்றும் சேவைகளை ஆன்லைனில் எளிதாகப் பெறுங்கள்.</p>

        <hr style="border: 0.5px solid #eee; margin: 20px 0;">

        <h3>எங்களைத் தொடர்பு கொள்ள:</h3>
        <div class="btn-container">
            <!-- வாட்ஸ்அப் எண் (94... பதில் உங்கள் எண்ணை போடவும்) -->
            <a href="https://wa.me/94770000000" target="_blank" class="btn whatsapp-btn">💬 WhatsApp-இல் பேச</a>
            
            <!-- போன் எண் -->
            <a href="tel:+94770000000" class="btn call-btn">📞 போன் செய்ய</a>

            <!-- Google Maps லிங்க் -->
            <a href="https://maps.google.com" target="_blank" class="btn map-btn">📍 எங்கள் கடையின் முகவரி</a>
        </div>
    </div>

</body>
</html>
